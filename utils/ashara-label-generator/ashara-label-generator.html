<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashara Label Generator</title>
<style>
/* ─── Screen UI ───────────────────────────────────────────── */
* { box-sizing: border-box; }

/* Force background colors to print */
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
body {
  font-family: Arial, sans-serif;
  max-width: 960px;
  margin: 0 auto;
  padding: 20px;
  background: #f9f9f9;
  color: #222;
}
h1 { font-size: 1.4rem; margin: 0 0 16px; }
.controls {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  background: #fff;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid #ddd;
  margin-bottom: 16px;
  align-items: flex-end;
}
.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-group label { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.4px; }
.ctrl-group select,
.ctrl-group input[type="date"],
.ctrl-group input[type="text"] {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 13px;
  background: #fff;
}
button {
  padding: 8px 18px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn-print { background: #1a73e8; color: #fff; }
.btn-print:hover { background: #1557b0; }
.btn-secondary { background: #eee; color: #333; }
.btn-secondary:hover { background: #ddd; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  background: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #ddd;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; }
.legend-dot { width: 22px; height: 10px; border-radius: 2px; flex-shrink: 0; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
thead tr { background: #f0f0f0; }
th { padding: 9px 10px; text-align: left; font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid #ddd; }
td { padding: 7px 10px; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8f8f8; }

.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  color: #fff;
  white-space: nowrap;
}
.cat-bar { width: 10px; height: 10px; border-radius: 1px; }

td input[type="text"] {
  width: 100%;
  padding: 4px 7px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 13px;
}
td input[type="text"]:focus { outline: none; border-color: #1a73e8; }

.dimmed td { opacity: 0.4; }
.dimmed td input { opacity: 0.7; }

.screen-preview {
  margin-top: 20px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 14px 16px;
}
.screen-preview h3 { margin: 0 0 12px; font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
.preview-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
/* Mini label preview on screen */
.preview-label {
  border: 1px solid #ccc;
  border-radius: 3px;
  overflow: hidden;
  background: #fff;
}
.preview-label.size-small { width: 168px; height: 64px; }
.preview-label.size-large { width: 256px; height: 128px; }
.preview-stripe { height: 7px; }
.preview-body { padding: 4px 7px; display: flex; flex-direction: column; justify-content: center; height: calc(100% - 7px); }
.preview-cat { font-size: 7px; color: #777; text-transform: uppercase; letter-spacing: 0.3px; }
.preview-name { font-size: 10px; font-weight: 700; line-height: 1.2; margin: 1px 0; }
.preview-serving { font-size: 8px; color: #555; }
.preview-label.size-small .preview-date { font-size: 6pt; color: #222; margin-top: 1.5pt; font-weight: 900; }
.preview-label.size-large .preview-stripe { height: 12px; }
.preview-label.size-large .preview-cat { font-size: 9px; }
.preview-label.size-large .preview-name { font-size: 13px; margin: 3px 0; }
.preview-label.size-large .preview-serving { font-size: 10px; }
.preview-label.size-large .preview-date { font-size: 8.5pt; color: #222; margin-top: 3pt; font-weight: 900; }

/* ─── Print Styles ────────────────────────────────────────── */
@media print {
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  @page { size: 8.5in 11in; margin: 0; }
}

#print-area { display: none; }

/* Label sheet wrapper — one per printed page */
.label-sheet {
  width: 8.5in;
  min-height: 11in;
  page-break-after: always;
  break-after: page;
  overflow: hidden;
}

/* ── Avery 5160 / 5960  1" × 2.625"  30 per sheet ── */
.sheet-small {
  padding-top: 0.5in;
  padding-bottom: 0.5in;
  padding-left: 0.1875in;
  padding-right: 0.1875in;
  display: grid;
  grid-template-columns: 2.625in 2.625in 2.625in;
  grid-auto-rows: 1in;
  column-gap: 0.125in;
  row-gap: 0in;
}

/* ── 2" × 4"  10 per sheet ── */
.sheet-large {
  padding-top: 0.5in;
  padding-bottom: 0.5in;
  padding-left: 0.19in;
  padding-right: 0.19in;
  display: grid;
  grid-template-columns: 4in 4in;
  grid-auto-rows: 2in;
  column-gap: 0.12in;
  row-gap: 0in;
}

/* Individual label cell */
.lbl {
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.lbl-stripe { flex-shrink: 0; }
.lbl-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Small label text */
.sheet-small .lbl-stripe { height: 0.1in; }
.sheet-small .lbl-body { padding: 0.04in 0.07in 0.04in 0.07in; }
.sheet-small .lbl-cat  { font-size: 5.5pt; color: #666; text-transform: uppercase; letter-spacing: 0.3pt; }
.sheet-small .lbl-name { font-size: 8.5pt; font-weight: bold; line-height: 1.15; margin: 1pt 0; }
.sheet-small .lbl-srv  { font-size: 6.5pt; color: #444; }
.sheet-small .lbl-date { font-size: 6pt; color: #222; margin-top: 1.5pt; font-weight: 900; }

/* Large label text */
.sheet-large .lbl-stripe { height: 0.15in; }
.sheet-large .lbl-body { padding: 0.1in 0.14in; }
.sheet-large .lbl-cat  { font-size: 8pt; color: #555; text-transform: uppercase; letter-spacing: 0.5pt; }
.sheet-large .lbl-name { font-size: 14pt; font-weight: bold; line-height: 1.2; margin: 4pt 0; }
.sheet-large .lbl-srv  { font-size: 9.5pt; color: #333; }
.sheet-large .lbl-date { font-size: 8.5pt; color: #222; margin-top: 3pt; font-weight: 900; }
</style>
</head>

function catColorStyle(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  const color = luminance > 0.6 ? '#333' : '#fff';
  const border = luminance > 0.75 ? '1px solid #ccc' : 'none';
  return `background:${hex};color:${color};border:${border}`;
}

// ─── State ──────────────────────────────────────────────────
let currentItems = []; // working copy of items for current meal

// ─── Init ───────────────────────────────────────────────────
(function init() {
  // Populate meal dropdown
  const sel = document.getElementById('mealSelect');
  MEALS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.title + (m.sub ? '  (' + m.sub + ')' : '');
    sel.appendChild(opt);
  });

  // Default date = today
  const today = new Date();
  document.getElementById('prepDate').value = today.toISOString().slice(0,10);

  // Build legend
  buildLegend();

  // Auto-load first meal
  sel.value = 'n1';
  loadMeal();
})();

function buildLegend() {
  const lg = document.getElementById('legend');
  Object.entries(CATS).forEach(([k,v]) => {
    lg.innerHTML += `<div class="legend-item">
      <div class="legend-dot" style="${catColorStyle(v.color)}"></div>
      <span>${v.label}</span>
    </div>`;
  });
}

// ─── Load Meal → Populate Table ─────────────────────────────
function loadMeal() {
  const id = document.getElementById('mealSelect').value;
  const meal = MEALS.find(m => m.id === id);
  if (!meal) return;

  // Deep copy so edits don't mutate master data
  currentItems = meal.items.map(i => ({ ...i, qty: 1 }));

  const tbody = document.getElementById('itemsBody');
  tbody.innerHTML = '';

  currentItems.forEach((item, idx) => {
    const cat = CATS[item.cat];
    const empty = !item.name;
    const tr = document.createElement('tr');
    if (empty) tr.className = 'dimmed';
    tr.innerHTML = `
      <td style="text-align:center">
        <input type="checkbox" id="chk${idx}" ${empty ? '' : 'checked'}>
      </td>
      <td>
        <span class="cat-chip" style="${catColorStyle(cat.color)}">
          ${cat.label}
        </span>
      </td>
      <td>
        <input type="text" id="name${idx}" value="${item.name}"
          oninput="currentItems[${idx}].name=this.value;refreshPreview()"
          placeholder="(not served this meal)">
      </td>
      <td>
        <input type="text" id="srv${idx}" value="${item.serving}"
          oninput="currentItems[${idx}].serving=this.value;refreshPreview()"
          placeholder="Serving style…">
      </td>
      <td style="text-align:center">
        <input type="number" id="qty${idx}" value="1" min="1" max="99"
          style="width:50px;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:13px;text-align:center"
          oninput="currentItems[${idx}].qty=parseInt(this.value)||1;refreshPreview()">
      </td>`;
    tbody.appendChild(tr);
  });

  refreshPreview();
}

function selectAll(checked) {
  currentItems.forEach((_, idx) => {
    const chk = document.getElementById('chk'+idx);
    if (chk) chk.checked = checked;
  });
}

// ─── Screen Preview ─────────────────────────────────────────
function refreshPreview() {
  const size = document.getElementById('labelSize').value;
  const dateVal = document.getElementById('prepDate').value;
  const dateStr = dateVal
    ? new Date(dateVal + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : '';

  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';

  const selected = getSelectedItems();
  if (!selected.length) {
    document.getElementById('previewSection').style.display = 'none';
    return;
  }
  document.getElementById('previewSection').style.display = 'block';

  const previewH3 = document.querySelector('#previewSection h3');
  previewH3.textContent = `Label Preview — ${selected.length} label${selected.length !== 1 ? 's' : ''} total`;

  selected.forEach(item => {
    const cat = CATS[item.cat];
    const div = document.createElement('div');
    div.className = `preview-label size-${size}`;
    div.innerHTML = `
      <div class="preview-stripe" style="background:${cat.color}"></div>
      <div class="preview-body">
        <div class="preview-cat">${cat.label}</div>
        <div class="preview-name">${item.name || '—'}</div>
        ${item.serving ? `<div class="preview-serving">${item.serving}</div>` : ''}
        ${dateStr ? `<div class="preview-date">Prep: ${dateStr}</div>` : ''}
      </div>`;
    grid.appendChild(div);
  });
}

// ─── Get Selected Items (expanded by qty) ───────────────────
function getSelectedItems() {
  const expanded = [];
  currentItems.forEach((item, idx) => {
    const chk = document.getElementById('chk'+idx);
    if (chk && chk.checked && item.name.trim()) {
      const qty = parseInt(document.getElementById('qty'+idx)?.value) || 1;
      for (let q = 0; q < qty; q++) expanded.push(item);
    }
  });
  return expanded;
}

// ─── Print ───────────────────────────────────────────────────
function printLabels() {
  const size = document.getElementById('labelSize').value;
  const dateVal = document.getElementById('prepDate').value;
  const dateStr = dateVal
    ? new Date(dateVal + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : '';

  const selected = getSelectedItems();
  if (!selected.length) {
    alert('No items selected to print.');
    return;
  }

  const maxPerSheet = size === 'small' ? 30 : 10;
  const sheetClass = size === 'small' ? 'sheet-small' : 'sheet-large';

  // Split into pages
  const pages = [];
  for (let i = 0; i < selected.length; i += maxPerSheet) {
    pages.push(selected.slice(i, i + maxPerSheet));
  }

  const printArea = document.getElementById('print-area');
  printArea.innerHTML = '';

  pages.forEach(pageItems => {
    const sheet = document.createElement('div');
    sheet.className = `label-sheet ${sheetClass}`;

    // Fill up to maxPerSheet with labels (pad with empties)
    for (let i = 0; i < maxPerSheet; i++) {
      const item = pageItems[i];
      const cell = document.createElement('div');
      cell.className = 'lbl';

      if (item) {
        const cat = CATS[item.cat];
        cell.innerHTML = `
          <div class="lbl-stripe" style="background:${cat.color}"></div>
          <div class="lbl-body">
            <div class="lbl-cat">${cat.label}</div>
            <div class="lbl-name">${item.name}</div>
            ${item.serving ? `<div class="lbl-srv">${item.serving}</div>` : ''}
            ${dateStr ? `<div class="lbl-date">Prep: ${dateStr}</div>` : ''}
          </div>`;
      }
      // Empty cells just render as blank label spaces
      sheet.appendChild(cell);
    }

    printArea.appendChild(sheet);
  });

  window.print();
}
</script>
